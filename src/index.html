<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Escape Rooms – Prototipo</title></head>
<body style="font-family:sans-serif;max-width:500px;margin:20px auto">
<h1>Escape Rooms</h1>

<h3>Salas</h3>
<ul>
  <li>La mansión del terror (Terror)</li>
  <li>Misión Marte (Ciencia ficción)</li>
  <li>El crimen del museo (Misterio)</li>
</ul>

<h3>Reservar</h3>
<select id="sala">
  <option>La mansión del terror</option>
  <option>Misión Marte</option>
  <option>El crimen del museo</option>
</select>
<select id="hora"><option>17:00</option><option>19:00</option><option>21:00</option></select>
<input id="nombre" placeholder="Tu nombre">
<button onclick="reservar()">Reservar</button>

<h3>Reservas</h3>
<ul id="lista"></ul>

<script>
const reservas=[];
function reservar(){
  const nombre=document.getElementById("nombre").value.trim();
  if(!nombre) return alert("Escribe tu nombre");
  reservas.push(sala.value+" · "+hora.value+" · "+nombre);
  lista.innerHTML=reservas.map(r=>"<li>"+r+"</li>").join("");
}
</script>
</body></html>
